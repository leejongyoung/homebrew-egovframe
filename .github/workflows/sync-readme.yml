name: Sync README.md from default language

# Keep the root README.md in sync with the configured default language file
# Runs on push to work branch when docs/ files change, or manually

on:
  push:
    branches: [work]
    paths:
      - docs/config.yml
      - docs/README.*.md
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if no changes detected"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5a00007b7300e95814a7d754d6a4c8e0b1f3d6e5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Sync README.md from default language
        id: sync
        run: python3 scripts/sync_readme.py

      - name: Commit and push if changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync README.md from default language (${{ github.event.repository.default_branch }})"
          git push origin work