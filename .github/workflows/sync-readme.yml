name: Sync README.md from default language

# Keep the root README.md in sync with the configured default language file
# Runs on push to work branch when docs/ files change, or manually

on:
  push:
    branches: [work]
    paths:
      - docs/config.yml
      - docs/README.*.md
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if no changes detected"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5a00007b7300e95814a7d754d6a4c8e0b1f3d6e5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Sync README.md from default language
        id: sync
        run: |
          python3 <<'PYEOF'
import yaml
import subprocess
from pathlib import Path

repo_root = Path(".")
docs_dir = repo_root / "docs"

# Load config
with open(docs_dir / "config.yml", "r", encoding="utf-8") as f:
    config = yaml.safe_load(f)

default_lang = config.get("default_language", "en")
languages = config.get("languages", {})

if default_lang not in languages:
    print(f"Error: default_language '{default_lang}' not found in languages mapping")
    exit(1)

source_file = repo_root / languages[default_lang]
if not source_file.exists():
    print(f"Error: source file {source_file} not found")
    exit(1)

# Read source content
source_content = source_file.read_text(encoding="utf-8")

# Read current README.md
readme_path = repo_root / "README.md"
current_content = readme_path.read_text(encoding="utf-8") if readme_path.exists() else ""

if source_content != current_content:
    readme_path.write_text(source_content, encoding="utf-8")
    print(f"Updated README.md from {languages[default_lang]}")
    print("changed=true")
else:
    print("README.md already up to date")
    print("changed=false")

PYEOF

      - name: Commit and push if changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync README.md from default language (${{ github.event.repository.default_branch }})"
          git push origin work