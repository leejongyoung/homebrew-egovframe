name: Release

# Publishes a GitHub Release (tag = IDE version, e.g. 5.0.2, like the existing 4.3.1 / 4.2.0 / 4.1.0)
# when `work` gets a cask for a version that has no release yet. A merged update-casks PR triggers it.
# Backfill by hand: run it with `version` and `ref` (a commit that contains that version's cask).

on:
  push:
    branches: [work]
    paths:
      - Casks/egovframedev-latest.rb
  workflow_dispatch:
    inputs:
      version:
        description: "IDE version to release (default: the version of egovframedev-latest)"
        type: string
        default: ""
      ref:
        description: "Backfill: commit to tag; the version's cask is read from it (default: this branch's head)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          target=$(git rev-parse "${REF:-HEAD}^{commit}")
          # Read the casks as they were at the target commit.
          root=$(mktemp -d)
          git archive "$target" Casks | tar -x -C "$root"
          version=${REQUESTED:-$(python3 scripts/release_notes.py --latest --root "$root")}
          if gh release view "$version" >/dev/null 2>&1; then
            echo "::notice::release $version already exists"
            exit 0
          fi
          # A cask that is gone from the checked-out branch (superseded by a newer patch) is a historical release.
          historical=()
          [ -f "Casks/egovframedev@$version.rb" ] || historical=(--historical)
          python3 scripts/release_notes.py "$version" --root "$root" "${historical[@]}" > notes.md
          current=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName,isLatest \
            --jq '.[] | select(.isLatest) | .tagName')
          if [ -z "$current" ] || [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" = "$version" ]; then
            latest=true
          else
            latest=false
          fi
          gh release create "$version" --target "$target" --title "eGovFrame IDE $version" \
            --notes-file notes.md --latest="$latest"
          echo "released $version at ${target:0:7} (latest=$latest, historical=${#historical[@]})" | tee -a "$GITHUB_STEP_SUMMARY"
